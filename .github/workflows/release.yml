name: release

# Pushing a tag such as 0.2.0 makes a draft GitHub release with the three files Obsidian installs.
# The tag must match the version in manifest.json. Publish the draft by hand after checking it.
on:
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: make check
      - name: Tag matches the manifest
        run: test "$(node -p "require('./manifest.json').version")" = "${GITHUB_REF_NAME}"
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" main.js manifest.json styles.css --draft --title "${GITHUB_REF_NAME}" --generate-notes
